<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>

<title>I love you sen</title>
<style>
:root{
  --bg:#fff6d9;
  --note:#f8f8f3;
  --text:#122;
  --accent:#ff8da1;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
.center{width:980px;max-width:96vw;height:760px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .9s ease, transform 1s ease}
.jar-wrap{position:relative;width:640px;height:700px;transition:opacity .9s ease}
canvas{display:block}
h2{margin:8px 0 12px 0}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,14,20,.45);opacity:0;pointer-events:none;transition:opacity .18s}
.modal.show{opacity:1;pointer-events:auto}
.modal .box{background:white;padding:18px;border-radius:12px;max-width:720px;max-height:86vh;overflow:auto}
.close{margin-top:8px;padding:6px 10px;border:none;border-radius:8px;background:#ddd;cursor:pointer}
.floating-note{position:absolute;padding:12px 18px;background:var(--note);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.12);font-size:14px;width:max-content;max-width:240px;line-height:1.4;opacity:0;transform-origin:center;pointer-events:none;
  background-image:
    radial-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
    linear-gradient(to bottom right, rgba(255,255,255,0.4), rgba(220,220,220,0.1));
  background-size:3px 3px,100% 100%;
}
/* float animation (paper) */
@keyframes floatUp{
  0%{transform:scale(.92) rotate(3deg); opacity:0}
  8%{opacity:1}
  58%{transform:translateY(-120px) rotate(-3deg) scale(1)}
  100%{transform:translateY(-220px) rotate(2deg) scale(1.04); opacity:0}
}

/* DEScent overlay: fills screen and shows infinite marbles */
#descentOverlay{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(180deg,#071226 0%, #040516 60%); opacity:0; pointer-events:none; transition:opacity 1s ease;
  z-index:80; overflow:hidden;
}
#descentOverlay.show{opacity:1; pointer-events:auto}
#descentCanvas{width:100vw; height:100vh; display:block}

/* subtle vignette for basement */
#descentOverlay::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(80% 60% at 50% 30%, rgba(255,255,255,0.02), rgba(0,0,0,0.5));
}

/* a gentle "scroll" container to create the feel of moving down */
.scroll-wrap{
  position:absolute; inset:0; transform:translateY(0); transition:transform 1.2s ease;
}

/* small subtle caption down there (optional) */
.basement-hint{
  position:absolute; bottom:32px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,0.14); font-size:13px; letter-spacing:1px;
}

/* credit */
.credit{position:fixed;left:12px;bottom:10px;font-size:12px;color:#3a3a3a;opacity:.7;z-index:5}
</style>
</head>
<body>
  <div class="center" id="mainCenter">
    <h2>Things i love about you (Pull the marbles out!!)</h2>
    <div class="jar-wrap" id="jarWrap"><canvas id="c" width="640" height="700" aria-label="Glass jar with marbles"></canvas></div>
  </div>

  <div id="modal" class="modal"><div class="box" id="modalBox"></div></div>
  <div class="credit">i lab you senn</div>

  <!-- Descent overlay (hidden until triggered) -->
  <div id="descentOverlay" aria-hidden="true">
    <div class="scroll-wrap" id="scrollWrap">
      <canvas id="descentCanvas"></canvas>
      <div class="basement-hint">infinite</div>
    </div>
  </div>

<script>
/* ---------------------------------------------------
  Full single-file experience:
  - Jar with marbles and gentle collisions
  - Floating crumpled note animates from marble position (shows the note text)
  - When the last marble is pulled, the main jar fades and a descent animation reveals
    a dark infinite "basement" with countless marbles and faint moving reflections.
  - Notes (SAMPLES) are baked into the file below.
  --------------------------------------------------- */

/* ---------------- SAMPLES (your notes) ---------------- */
const SAMPLES = [

  { id: '2', text: "i love how patient you are with me, even when i get mad at a game or anything" },

  { id: '22', text: "i love how you make me laugh without even trying" },
  { id: '23', text: "i love how thoughtful you are with the smallest gestures" },
  { id: '24', text: "i love how well you treat me" },
  { id: '25', text: "i love that you always try to understand, even when it’s hard" },
  { id: '26', text: "i love how you brighten my day even on the darkest ones" },
  { id: '27', text: "i love that you’re kind to strangers" },
  { id: '28', text: "i love how curious you are about everything" },
  { id: '29', text: "i love how you light up when you talk about something you care about" },
  { id: '30', text: "i love how you make me feel like i matter" },

  { id: '34', text: "i love how you always know when i need an i love you from you" },
  { id: '35', text: "i love how perfect you are to me" },
  { id: '36', text: "i love how adorable you are when you cant call me a petname face to face" },
  { id: '37', text: "i love how nice your hands look" },

  { id: '43', text: "i love how you make even late-night talks feel magical" },
  { id: '44', text: "i love how your laughter and voice fixes everything for a while, sometimes forever" },
  { id: '45', text: "i love how you treat animals especially cats like they’re yours" },
  { id: '46', text: "i love how you trust me with your thoughts" },
  { id: '47', text: "i love the way you listen to me" },
  { id: '48', text: "i love how you never give up on the people you care about" },
  { id: '49', text: "i love that you make me want to be a better person" },
  { id: '50', text: "i love that somehow, you always make everything okay" },
];

/* ---------------- CONFIG ---------------- */
const CONFIG = {
  canvasW:640, canvasH:700,
  jar: { x:320+10, y:430, width:380, height:400, neckWidth:140, neckY:160, rimHeight:24 },
  gravity:0.45, friction:0.997, bounce:0.8, marbleRadius:14
};

/* ---------- core elements ---------- */
const c = document.getElementById('c'), ctx = c.getContext('2d');
const mainCenter = document.getElementById('mainCenter');
const jarWrap = document.getElementById('jarWrap');
const modal = document.getElementById('modal'), modalBox = document.getElementById('modalBox');
const descentOverlay = document.getElementById('descentOverlay'), descentCanvas = document.getElementById('descentCanvas');
const scrollWrap = document.getElementById('scrollWrap');

let marbles = [], grab = null;
let descentStarted = false;

/* ---------- util ---------- */
function rand(a,b){ return Math.random()*(b-a)+a; }
function uid(){ return 'm-'+Math.random().toString(36).slice(2,9); }

/* ---------- jar drawing ---------- */
function drawJarShape(){
  const j = CONFIG.jar;
  const left = j.x - j.width/2, right = j.x + j.width/2, top = j.y - j.height/2, bottom = j.y + j.height/2;
  ctx.save();
  const body = new Path2D();
  body.moveTo(left+60, top+40);
  body.bezierCurveTo(left+10, top+140, left+20, bottom-60, left+40, bottom-24);
  body.bezierCurveTo(left+80, bottom+30, right-80, bottom+30, right-40, bottom-24);
  body.bezierCurveTo(right-20, bottom-60, right-10, top+140, right-60, top+40);
  body.bezierCurveTo(right-90, top+10, left+90, top+10, left+60, top+40);
  const grad = ctx.createLinearGradient(0, top, 0, bottom);
  grad.addColorStop(0, 'rgba(255,255,255,0.85)');
  grad.addColorStop(1, 'rgba(240,240,240,0.06)');
  ctx.fillStyle = grad; ctx.fill(body);
  ctx.beginPath(); ctx.ellipse(j.x, bottom+12, j.width/2-30, 18, 0, 0, Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.08)'; ctx.fill();
  // soft rim highlight
  const neckY = j.y - j.height/2 + j.neckY;
  ctx.beginPath(); ctx.ellipse(j.x, neckY, j.neckWidth/2 + 8, j.rimHeight/2 + 6, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.96)'; ctx.fill();
  ctx.restore();
}

/* ---------- marbles create/draw ---------- */
function createMarble(note){
  const j = CONFIG.jar;
  const minX = j.x - j.width/2 + 50, maxX = j.x + j.width/2 - 50;
  const x = rand(minX, maxX), y = rand(j.y - j.height/2 + 80, j.y + j.height/2 - 60);
  marbles.push({ id: note.id || uid(), text: note.text || '', x, y, vx: rand(-1,1), vy: rand(-1,1), r: CONFIG.marbleRadius, grabbed:false });
}

function drawMarbles(){
  for(const m of marbles){
    // marble shading
    const g = ctx.createRadialGradient(m.x-4, m.y-6, 1, m.x, m.y, m.r);
    g.addColorStop(0, '#fff'); g.addColorStop(1, '#acc');
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI*2); ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 0.7; ctx.strokeStyle = 'rgba(0,0,0,0.06)'; ctx.stroke();
    // tiny highlight
    ctx.beginPath(); ctx.ellipse(m.x - m.r*0.35, m.y - m.r*0.5, m.r*0.35, m.r*0.2, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill();
  }
}

/* ---------- physics step & collisions ---------- */
function step(){
  const j = CONFIG.jar;
  const ix = j.width/2 - 40, iy = j.height/2 - 40;
  for(const m of marbles){
    if(m.grabbed) continue;
    m.vy += CONFIG.gravity;
    m.vx *= CONFIG.friction; m.vy *= CONFIG.friction;
    m.x += m.vx; m.y += m.vy;
    // keep inside jar ellipse
    const dx = (m.x - j.x)/ix, dy = (m.y - j.y)/iy;
    if(dx*dx + dy*dy > 1){
      const ang = Math.atan2(m.y - j.y, m.x - j.x);
      m.x = j.x + Math.cos(ang)*ix*0.98;
      m.y = j.y + Math.sin(ang)*iy*0.98;
      const nx = Math.cos(ang), ny = Math.sin(ang);
      const vdot = m.vx*nx + m.vy*ny;
      m.vx = m.vx - 1.9*vdot*nx;
      m.vy = m.vy - 1.9*vdot*ny;
      m.vx *= CONFIG.bounce; m.vy *= CONFIG.bounce;
    }
    // floor
    if(m.y > c.height - m.r - 8){ m.y = c.height - m.r - 8; m.vy *= -CONFIG.bounce; }
  }

  // pairwise collisions (gentle, realistic)
  for(let i=0;i<marbles.length;i++){
    for(let j=i+1;j<marbles.length;j++){
      const a = marbles[i], b = marbles[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      const minDist = a.r + b.r;
      if(dist > 0 && dist < minDist){
        const overlap = (minDist - dist) / 2;
        const nx = dx / dist, ny = dy / dist;
        a.x -= nx * overlap; a.y -= ny * overlap;
        b.x += nx * overlap; b.y += ny * overlap;
        // velocity projection - gentle impulse
        const dvx = b.vx - a.vx, dvy = b.vy - a.vy;
        const impact = dvx * nx + dvy * ny;
        if(impact < 0){
          const restitution = 0.88; // gentle bounce
          const impulse = (-(1 + restitution) * impact) / 2;
          a.vx -= impulse * nx; a.vy -= impulse * ny;
          b.vx += impulse * nx; b.vy += impulse * ny;
        }
      }
    }
  }
}

/* ---------- interaction ---------- */
function findMarbleAt(x,y){
  for(let i=marbles.length-1;i>=0;i--){
    const m = marbles[i];
    if(Math.hypot(m.x - x, m.y - y) <= m.r + 2) return m;
  }
  return null;
}

function revealMarble(m){
  // remove marble from array
  marbles = marbles.filter(x => x.id !== m.id);
  floatNote(m.x, m.y, m.text);
  // if it was last marble, schedule descent after animation (and after modal closed)
  if(marbles.length === 0){
    // if modal will open, wait for it to close; otherwise trigger after float finishes
    pendingDescent = true;
  }
}

let pendingDescent = false; // set when last marble pulled

function floatNote(x,y,text){
  const note = document.createElement('div');
  note.className = 'floating-note';
  note.textContent = text;
  const jarRect = c.getBoundingClientRect();
  const wrap = jarWrap;
  // position relative to jarWrap
  note.style.left = `${x - jarRect.left - 40}px`;
  note.style.top = `${y - jarRect.top - 30}px`;
  wrap.appendChild(note);
  // animate with keyframes
  note.style.animation = 'floatUp 2.2s ease-out forwards';
  note.style.opacity = '1';
  setTimeout(()=>{
    if(wrap.contains(note)) wrap.removeChild(note);
    openModal({text});
    // if pendingDescent was set earlier AND modal is not desired to interrupt, start descent after modal closes or now
    if(pendingDescent){
      // start descent after a small delay to allow user to read a moment (or close modal)
      // close modal automatically after 1400ms if user hasn't closed it, then descend
      setTimeout(()=> {
        if(modal.classList.contains('show')){
          // close modal and then begin descent
          modal.classList.remove('show');
          setTimeout(triggerDescent, 500);
        } else {
          triggerDescent();
        }
      }, 1200);
      pendingDescent = false;
    }
  }, 2200);
}

function openModal(note){
  modal.classList.add('show');
  modalBox.innerHTML = `<p style="margin:0 0 8px 0; white-space:pre-wrap;">${escapeHtml(note.text)}</p><button class="close">Close</button>`;
  modalBox.querySelector('button.close').onclick = ()=> modal.classList.remove('show');
}

/* ---------- pointer events for dragging marbles ---------- */
c.addEventListener('pointerdown', e => {
  if(descentStarted) return;
  const r = c.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const m = findMarbleAt(x,y);
  if(m){ grab = { m, offx: x - m.x, offy: y - m.y }; m.grabbed = true; m.vx = 0; m.vy = 0; }
});
window.addEventListener('pointermove', e => {
  if(!grab || descentStarted) return;
  const r = c.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  grab.m.x = x - grab.offx; grab.m.y = y - grab.offy;
});
window.addEventListener('pointerup', e => {
  if(!grab || descentStarted) return;
  const m = grab.m; m.grabbed = false;
  const neckTop = CONFIG.jar.y - CONFIG.jar.height/2 + CONFIG.jar.neckY;
  if(m.y < neckTop - 26) revealMarble(m);
  grab = null;
});

/* ---------- main loop ---------- */
function loop(){
  step();
  ctx.clearRect(0,0,c.width,c.height);
  // subtle background
  const bgGrad = ctx.createLinearGradient(0,0,0,c.height);
  bgGrad.addColorStop(0, 'rgba(255,246,217,0.9)');
  bgGrad.addColorStop(1, 'rgba(255,246,217,1)');
  ctx.fillStyle = bgGrad; ctx.fillRect(0,0,c.width,c.height);
  drawJarShape();
  drawMarbles();
  requestAnimationFrame(loop);
}

/* ---------- initialize marbles and canvas ---------- */
function init(){
  c.width = CONFIG.canvasW; c.height = CONFIG.canvasH;
  for(const s of SAMPLES) createMarble(s);
  loop();
}

/* ---------- helper: escape HTML for modal safety ---------- */
function escapeHtml(str){
  return (''+str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------- DESCENT SCENE ----------------
   - When triggered: fade main UI, show descent overlay
   - descentCanvas draws a deep field of many tiny marbles (particles)
   - moving light reflections: multiple large soft radial lights driven by sin waves
   - to suggest infinity we draw many layers with depth scaling
--------------------------------------------------*/

let descentCtx, descentW, descentH;
let particles = [];
let lights = [];
const PARTICLE_COUNT = 700; // visual count (layers and depth give 'uncountable' feel)

function setupDescentCanvas(){
  descentCanvas.width = window.innerWidth * devicePixelRatio;
  descentCanvas.height = window.innerHeight * devicePixelRatio;
  descentCanvas.style.width = window.innerWidth + 'px';
  descentCanvas.style.height = window.innerHeight + 'px';
  descentCtx = descentCanvas.getContext('2d');
  descentCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  descentW = window.innerWidth; descentH = window.innerHeight;

  // generate particles with depth (z) to simulate distance
  particles = [];
  for(let i=0;i<PARTICLE_COUNT;i++){
    const z = Math.random(); // 0 (near) to 1 (far)
    const px = Math.random() * descentW * (1 + z*6) - descentW*z*3; // spread increases with z
    const py = Math.random() * descentH * (1 + z*2) - descentH*z*0.5;
    const r = 0.6 + (1 - z) * 1.8; // near particles slightly bigger
    const alpha = 0.03 + (1 - z) * 0.25; // near more visible
    const twinkle = Math.random() * Math.PI * 2;
    particles.push({x:px, y:py, z, r, alpha, baseAlpha:alpha, twinkle});
  }

  // lights that slowly move (sinusoidal)
  lights = [
    {x: descentW*0.2, y: descentH*0.25, radius: descentW*0.6, phase: Math.random()*Math.PI*2, speed: 0.12, color: 'rgba(255,240,200,0.06)'},
    {x: descentW*0.75, y: descentH*0.45, radius: descentW*0.7, phase: Math.random()*Math.PI*2, speed: 0.08, color: 'rgba(200,240,255,0.04)'},
    {x: descentW*0.5, y: descentH*0.7, radius: descentW*0.8, phase: Math.random()*Math.PI*2, speed: 0.06, color: 'rgba(220,220,255,0.03)'}
  ];

  // start the descent animation loop
  requestAnimationFrame(drawDescent);
}

let descentT = 0;
function drawDescent(t){
  descentT = t/1000;
  // clear
  descentCtx.clearRect(0,0,descentW,descentH);
  // deep background
  const g = descentCtx.createLinearGradient(0,0,0,descentH);
  g.addColorStop(0, '#0b1220');
  g.addColorStop(1, '#02020a');
  descentCtx.fillStyle = g; descentCtx.fillRect(0,0,descentW,descentH);

  // draw moving lights (soft additive)
  for(const L of lights){
    const ox = Math.sin(descentT * L.speed + L.phase) * 120;
    const oy = Math.cos(descentT * (L.speed*0.6) + L.phase) * 60;
    const cx = L.x + ox, cy = L.y + oy;
    const rad = descentCtx.createRadialGradient(cx, cy, 0, cx, cy, L.radius);
    rad.addColorStop(0, L.color);
    rad.addColorStop(1, 'rgba(0,0,0,0)');
    descentCtx.globalCompositeOperation = 'screen';
    descentCtx.fillStyle = rad; descentCtx.fillRect(0,0,descentW,descentH);
    descentCtx.globalCompositeOperation = 'source-over';
  }

  // draw particles in layers (farther ones dimmer and more spread)
  for(const p of particles){
    // twinkle
    const tw = Math.sin(descentT * 1.2 + p.twinkle) * 0.4 + 0.6;
    const alpha = p.baseAlpha * tw;
    descentCtx.beginPath();
    descentCtx.arc(p.x % (descentW * 2) - descentW*0.5, p.y % (descentH * 1.5) - descentH*0.25, p.r, 0, Math.PI*2);
    descentCtx.fillStyle = `rgba(220,230,255,${alpha})`;
    descentCtx.fill();
  }

  // subtle overlay grain (light)
  descentCtx.fillStyle = 'rgba(255,255,255,0.003)';
  descentCtx.fillRect(0,0,descentW,descentH);

  // loop
  if(descentStarted) requestAnimationFrame(drawDescent);
}

/* ---------- trigger descent ---------- */
function triggerDescent(){
  if(descentStarted) return;
  descentStarted = true;
  // fade out main UI
  mainCenter.style.opacity = '0';
  mainCenter.style.transform = 'translateY(-40px)';
  jarWrap.style.opacity = '0';
  // show descent overlay after fade
  setTimeout(()=>{
    descentOverlay.classList.add('show');
    // prepare canvas and animation
    setupDescentCanvas();
    // small upward camera drift while jar fades: translate the scrollWrap to simulate 'descending'
    scrollWrap.style.transform = 'translateY(0)';
    // after a frame, move it down slightly for effect (simulate deeper descent)
    setTimeout(()=> { scrollWrap.style.transform = 'translateY(120px)'; }, 80);
  }, 900);
}

/* ---------- window resize handling ---------- */
window.addEventListener('resize', ()=>{
  if(descentStarted) setupDescentCanvas();
});

/* ---------- init ---------- */
init();

/* ---------- safety: close modal on overlay click ---------- */
modal.addEventListener('click', (e)=> { if(e.target === modal) modal.classList.remove('show'); });

</script>
